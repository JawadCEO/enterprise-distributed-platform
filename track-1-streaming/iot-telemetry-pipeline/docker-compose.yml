name: iot-telemetry
# Local stack: one Kafka broker (KRaft), PostgreSQL, Redis and the four services, with memory caps
# sized for a 16GB laptop. The simulator runs on demand:
#   docker compose --profile sim run --rm network-simulator
# Three brokers for failure drills: add -f docker-compose.drills.yml

x-service: &service
  restart: unless-stopped
  environment: &service-env
    DB_URL: jdbc:postgresql://postgres:5432/iot
    DB_USER: iot
    DB_PASSWORD: iot
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP: kafka:9092
    KAFKA_PARTITIONS: "12"
    KAFKA_REPLICATION: "1"
    KAFKA_MIN_ISR: "1"
    JAVA_OPTS: "-Xmx256m -XX:+UseSerialGC"
    # Local development key only; set your own outside this laptop stack.
    IOT_OPERATOR_KEY: ${IOT_OPERATOR_KEY:-iot_localop_local-dev-only-operator-key}
  mem_limit: 400m

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "${IOT_KAFKA_PORT:-29192}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${IOT_KAFKA_PORT:-29192}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms768m"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    image: postgres:16-alpine
    ports:
      - "${IOT_PG_PORT:-5452}:5432"
    environment:
      POSTGRES_DB: iot
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100", "-c", "synchronous_commit=on"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    ports:
      - "${IOT_REDIS_PORT:-6389}:6379"
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Owns the schema: Flyway runs here, so the other services start after it is healthy. It also
  # stores dead letters from network.events.dlq and replays them.
  customer-api:
    <<: *service
    build: { context: ., args: { MODULE: customer-api } }
    image: iot/customer-api
    ports:
      - "${IOT_API_PORT:-18084}:8084"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck: &health
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT:-8084}/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  event-ingest:
    <<: *service
    build: { context: ., args: { MODULE: event-ingest } }
    image: iot/event-ingest
    ports:
      - "${IOT_INGEST_PORT:-18080}:8080"
    environment:
      <<: *service-env
      SERVER_PORT: "8080"
    depends_on:
      kafka: { condition: service_healthy }
      customer-api: { condition: service_healthy }
    healthcheck: *health

  state-processor:
    <<: *service
    build: { context: ., args: { MODULE: state-processor } }
    image: iot/state-processor
    ports:
      - "18081:8081"
    environment:
      <<: *service-env
      SERVER_PORT: "8081"
      PROCESSOR_CONCURRENCY: "3"
    depends_on:
      kafka: { condition: service_healthy }
      customer-api: { condition: service_healthy }
    healthcheck: *health

  presence-monitor:
    <<: *service
    build: { context: ., args: { MODULE: presence-monitor } }
    image: iot/presence-monitor
    ports:
      - "18082:8082"
    environment:
      <<: *service-env
      SERVER_PORT: "8082"
    depends_on:
      kafka: { condition: service_healthy }
      customer-api: { condition: service_healthy }
    healthcheck: *health

  network-simulator:
    profiles: ["sim"]
    build: { context: ., args: { MODULE: network-simulator } }
    image: iot/network-simulator
    environment:
      INGEST_URL: http://event-ingest:8080
      API_URL: http://customer-api:8084
      SCENARIO: ${SCENARIO:-steady}
      LINES: ${LINES:-1000}
      CUSTOMERS: ${CUSTOMERS:-5}
      TICK_SECONDS: ${TICK_SECONDS:-10}
      DURATION: ${DURATION:-120s}
      LEDGER_FILE: /ledger/ack-ledger.csv
      IOT_OPERATOR_KEY: ${IOT_OPERATOR_KEY:-iot_localop_local-dev-only-operator-key}
      JAVA_OPTS: "-Xmx384m"
    volumes:
      - ./target/ledger:/ledger
    mem_limit: 512m
    depends_on:
      event-ingest: { condition: service_healthy }
