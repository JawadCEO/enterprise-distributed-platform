# Carries out line commands against the network, paced per replica (NETWORK_RATE).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-worker
  labels:
    app.kubernetes.io/name: provisioning-worker
spec:
  replicas: 2
  revisionHistoryLimit: 5          # kubectl rollout undo goes back one of these (NFR-22)
  selector:
    matchLabels:
      app.kubernetes.io/name: provisioning-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # a new pod is ready before an old one stops
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provisioning-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: /actuator/prometheus
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: provisioning-worker
      initContainers:
        # customer-api owns the schema; the others start once its migrations have run.
        - name: wait-for-schema
          image: busybox:1.36
          command: ["sh", "-c", "until wget -qO- http://customer-api:8084/actuator/health/readiness | grep -q UP; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      containers:
        - name: provisioning-worker
          image: iot/provisioning-worker
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: iot-config
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: iot-secrets, key: DB_PASSWORD }
            - name: IOT_OPERATOR_KEY
              valueFrom:
                secretKeyRef: { name: iot-secrets, key: IOT_OPERATOR_KEY }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # let the Service stop routing here before the JVM starts shutting down
            preStop:
              exec: { command: ["sleep", "5"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: provisioning-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: provisioning-worker

---
apiVersion: v1
kind: Service
metadata:
  name: provisioning-worker
  labels:
    app.kubernetes.io/name: provisioning-worker
spec:
  selector:
    app.kubernetes.io/name: provisioning-worker
  ports:
    - name: http
      port: 8083
      targetPort: http
