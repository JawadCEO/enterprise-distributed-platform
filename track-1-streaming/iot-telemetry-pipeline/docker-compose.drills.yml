# Failure drills (part 3): three Kafka brokers instead of one, every topic with three replicas and
# min.insync.replicas=2, and a drill runner that kills one container in the middle of a simulator run.
#
#   docker compose -f docker-compose.yml -f docker-compose.drills.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.drills.yml run -d --rm -e TARGET=kafka-2 drill
#   docker compose -f docker-compose.yml -f docker-compose.drills.yml --profile sim run --rm network-simulator
#
# See docs/results/carrier-3-drills-*.md for the drills and their results.

x-broker-env: &broker-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"

x-drill-env: &drill-env
  KAFKA_BOOTSTRAP: kafka:9092,kafka-2:9092,kafka-3:9092
  KAFKA_REPLICATION: "3"
  KAFKA_MIN_ISR: "2"

services:
  kafka:
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${IOT_KAFKA_PORT:-29192}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    mem_limit: 768m

  kafka-2:
    image: apache/kafka:3.8.0
    hostname: kafka-2
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    mem_limit: 768m
    healthcheck: &broker-health
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-3:
    image: apache/kafka:3.8.0
    hostname: kafka-3
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    mem_limit: 768m
    healthcheck: *broker-health

  customer-api:
    environment: *drill-env
    depends_on: &brokers
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
  event-ingest:
    environment: *drill-env
  state-processor:
    environment: *drill-env
  presence-monitor:
    environment: *drill-env
  provisioning-worker:
    environment: *drill-env
  notifier:
    environment: *drill-env

  # Kills one service's container at DRILL_AT into the run, keeps it down for DRILL_FOR, then starts
  # it again, and logs each step with its time. It talks to Docker through the mounted socket.
  drill:
    profiles: ["drills"]
    image: docker:27.3.1-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./drills:/drills:ro
    environment:
      PROJECT: iot-telemetry
      TARGET: ${TARGET:-kafka-2}
      DRILL_AT: ${DRILL_AT:-60}
      DRILL_FOR: ${DRILL_FOR:-30}
      HOW: ${HOW:-kill}
    entrypoint: ["sh", "/drills/drill.sh"]
