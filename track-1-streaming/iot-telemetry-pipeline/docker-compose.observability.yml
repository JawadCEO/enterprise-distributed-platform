# Observability (part 4): traces in Jaeger, metrics in Prometheus, dashboards in Grafana, and Kafka
# consumer lag per partition from kafka-exporter. Add it to the usual stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build
#
# Grafana: http://localhost:3000 (dashboard "IoT carrier platform"). Jaeger: http://localhost:16686.
# Prometheus: http://localhost:9090. About 600 MB more memory.

x-tracing: &tracing
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
  TRACE_SAMPLING: ${TRACE_SAMPLING:-0.1}

services:
  customer-api:
    environment: *tracing
  event-ingest:
    environment: *tracing
  state-processor:
    environment: *tracing
  presence-monitor:
    environment: *tracing
  provisioning-worker:
    environment: *tracing
  notifier:
    environment: *tracing

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"
    ports:
      - "${IOT_JAEGER_PORT:-16686}:16686"
    mem_limit: 384m

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${IOT_PROMETHEUS_PORT:-9090}:9090"
    mem_limit: 384m

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:9092", "--topic.filter=^[a-z].*", "--group.filter=.*"]
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
    mem_limit: 64m

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/iot-platform.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${IOT_GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus, jaeger]
    mem_limit: 256m
