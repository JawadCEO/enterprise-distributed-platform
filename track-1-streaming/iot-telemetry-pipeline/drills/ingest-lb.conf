# Load balancer for the event-ingest instances in the rolling-deploy drill, standing in for a
# Kubernetes Service. Docker's DNS returns every running instance; a request that hits one that is
# stopping is retried on another.
resolver 127.0.0.11 valid=1s ipv6=off;

server {
    listen 8080;
    location / {
        set $ingest http://event-ingest:8080;
        proxy_pass $ingest;
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
    }
}
