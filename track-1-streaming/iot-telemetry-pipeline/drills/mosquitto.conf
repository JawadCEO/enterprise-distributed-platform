# MQTT broker for the HTTP vs MQTT test (Phase 0 PoC). Anonymous access is for this local test only;
# a real deployment authenticates each SIM with its own client certificate.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# QoS 1 messages a client may have unacknowledged; the default of 20 would throttle event-ingest's subscription.
max_inflight_messages 1000
max_queued_messages 200000
log_type error
log_type warning
