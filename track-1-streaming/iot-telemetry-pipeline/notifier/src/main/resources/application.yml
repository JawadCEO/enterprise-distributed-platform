server:
  port: 8085

spring:
  application:
    name: notifier
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iot}
    username: ${DB_USER:iot}
    password: ${DB_PASSWORD:iot}
    hikari:
      maximum-pool-size: 8
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      auto-offset-reset: earliest
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

iot:
  notifier:
    retry-for: ${NOTIFY_RETRY_FOR:24h}
    retry-max: ${NOTIFY_RETRY_MAX:10m}
    partitions: ${KAFKA_PARTITIONS:12}
    replication-factor: ${KAFKA_REPLICATION:1}
    min-insync-replicas: ${KAFKA_MIN_ISR:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      service: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
  # Spans are exported only when MANAGEMENT_OTLP_TRACING_ENDPOINT is set (docker-compose.observability.yml).
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}
