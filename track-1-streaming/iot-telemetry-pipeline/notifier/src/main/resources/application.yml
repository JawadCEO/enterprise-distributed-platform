server:
  port: 8085

spring:
  application:
    name: notifier
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iot}
    username: ${DB_USER:iot}
    password: ${DB_PASSWORD:iot}
    hikari:
      maximum-pool-size: 8
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

iot:
  notifier:
    retry-for: ${NOTIFY_RETRY_FOR:24h}
    retry-max: ${NOTIFY_RETRY_MAX:10m}
    partitions: ${KAFKA_PARTITIONS:12}
    replication-factor: ${KAFKA_REPLICATION:1}
    min-insync-replicas: ${KAFKA_MIN_ISR:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
