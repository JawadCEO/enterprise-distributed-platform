spring:
  application:
    name: network-simulator
  main:
    web-application-type: none
    banner-mode: off

iot:
  sim:
    ingest-url: ${INGEST_URL:http://localhost:8080}
    api-url: ${API_URL:http://localhost:8084}
    operator-key: ${IOT_OPERATOR_KEY:}
    network-key: ${NETWORK_KEY:}
    scenario: ${SCENARIO:steady}
    lines: ${LINES:1000}
    customers: ${CUSTOMERS:5}
    tick-seconds: ${TICK_SECONDS:10}
    duration: ${DURATION:300s}
    reconcile: ${RECONCILE:true}
    ledger-file: ${LEDGER_FILE:ack-ledger.csv}
    mode: ${MODE:traffic}
    request-rate: ${REQUEST_RATE:2}
    gateway-batch: ${GATEWAY_BATCH:0}
    network-url: ${NETWORK_URL:http://localhost:8090}
    network-latency: ${NETWORK_LATENCY:1s}
    webhooks: ${WEBHOOKS:true}
    webhook-host: ${WEBHOOK_HOST:}
    outage-region: ${OUTAGE_REGION:south}
    outage-start: ${OUTAGE_START:150s}
    outage-length: ${OUTAGE_LENGTH:90s}
    poll-seconds: ${POLL_SECONDS:0}
    bench-protocol: ${BENCH_PROTOCOL:http-batch}
    bench-rate: ${BENCH_RATE:1000}
    bench-disconnect-at: ${BENCH_DISCONNECT_AT:0s}
    bench-disconnect-share: ${BENCH_DISCONNECT_SHARE:0.1}
    bench-reconnect-after: ${BENCH_RECONNECT_AFTER:5s}
    mqtt-url: ${MQTT_URL:tcp://localhost:1883}
