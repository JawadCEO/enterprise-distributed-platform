global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - customer-api:8084
          - event-ingest:8080
          - state-processor:8081
          - presence-monitor:8082
          - provisioning-worker:8083
          - notifier:8085
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
