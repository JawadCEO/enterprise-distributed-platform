spring:
  application:
    name: device-simulator
  main:
    web-application-type: none
    banner-mode: off

iot:
  sim:
    gateway-url: ${GATEWAY_URL:http://localhost:8080}
    status-api-url: ${STATUS_API_URL:http://localhost:8084}
    operator-key: ${IOT_OPERATOR_KEY:}
    scenario: ${SCENARIO:steady}
    devices: ${DEVICES:1000}
    tenants: ${TENANTS:5}
    heartbeat-seconds: ${HEARTBEAT_SECONDS:10}
    duration: ${DURATION:300s}
    ledger-file: ${LEDGER_FILE:ack-ledger.csv}
