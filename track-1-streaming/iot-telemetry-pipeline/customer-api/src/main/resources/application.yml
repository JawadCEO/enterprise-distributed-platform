server:
  port: 8084

spring:
  application:
    name: customer-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iot}
    username: ${DB_USER:iot}
    password: ${DB_PASSWORD:iot}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

iot:
  requests:
    timeout: ${REQUEST_TIMEOUT:120s}
    rate-per-second: ${REQUEST_RATE_LIMIT:20}
    partitions: ${KAFKA_PARTITIONS:12}
    replication-factor: ${KAFKA_REPLICATION:1}
    min-insync-replicas: ${KAFKA_MIN_ISR:1}
  security:
    bootstrap-operator-key: ${IOT_OPERATOR_KEY:}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      service: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
  # Spans are exported only when MANAGEMENT_OTLP_TRACING_ENDPOINT is set (docker-compose.observability.yml).
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}
