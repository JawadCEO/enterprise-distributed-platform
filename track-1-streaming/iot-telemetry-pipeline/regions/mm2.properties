# MirrorMaker 2 for the two-region simulation (part 5): each region's network.events is copied to the
# other as <region>.network.events, and each region's state-processor reads both. Events are
# deduplicated by event id, so an event that reaches a region twice is counted once.
clusters = east, west
east.bootstrap.servers = kafka-east:9092
west.bootstrap.servers = kafka-west:9092

east->west.enabled = true
east->west.topics = network\\.events
west->east.enabled = true
west->east.topics = network\\.events

# One broker per region here; a real deployment keeps 3.
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

refresh.topics.interval.seconds = 5
emit.checkpoints.enabled = false
sync.group.offsets.enabled = false
sync.topic.acls.enabled = false
tasks.max = 4

# Copy fast: the freshness budget in the other region includes this hop.
producer.override.linger.ms = 5
producer.override.acks = all
