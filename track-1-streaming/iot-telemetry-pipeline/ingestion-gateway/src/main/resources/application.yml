server:
  port: 8080
  tomcat:
    max-swallow-size: 512KB

spring:
  application:
    name: ingestion-gateway
  threads:
    virtual:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iot}
    username: ${DB_USER:iot}
    password: ${DB_PASSWORD:iot}
    hikari:
      maximum-pool-size: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 2
        delivery.timeout.ms: 2000
        request.timeout.ms: 1500
        max.block.ms: 500

iot:
  gateway:
    partitions: ${KAFKA_PARTITIONS:12}
    replication-factor: ${KAFKA_REPLICATION:1}
    min-insync-replicas: ${KAFKA_MIN_ISR:1}
    device-rate-limit-per-sec: ${DEVICE_RATE_LIMIT:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
