apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  labels:
    app.kubernetes.io/name: podinfo
    owner: tenant
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: envoy-gateway-system
      sectionName: https
  hostnames: ["replaced-by-tenant-chart"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { group: "", kind: Service, name: podinfo, port: 80, weight: 1 }
