apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  labels:
    app.kubernetes.io/name: podinfo
    owner: tenant
spec:
  parentRefs:
    - name: shared
      namespace: envoy-gateway-system
      sectionName: https
  hostnames: ["replaced-by-tenant-chart"]
  rules:
    - backendRefs:
        - { name: podinfo, port: 80 }
