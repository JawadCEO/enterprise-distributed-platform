# Pulls the app's greeting from the tenant's secret store (FR-16, flow F7).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: podinfo
  labels:
    app.kubernetes.io/name: podinfo
    owner: tenant
spec:
  refreshInterval: 1h
  secretStoreRef: { name: tenant-secrets, kind: SecretStore }
  target: { name: podinfo }
  dataFrom:
    - extract:
        key: podinfo   # rewritten to platform/<cluster>/<tenant>/<app> by the tenant chart
