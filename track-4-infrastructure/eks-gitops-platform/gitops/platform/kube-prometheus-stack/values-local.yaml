# Trimmed for the 16GB laptop (NFR-6): short retention, no persistence.
prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }
alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
grafana:
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { memory: 256Mi }
# k3s does not expose these control-plane components separately.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }
