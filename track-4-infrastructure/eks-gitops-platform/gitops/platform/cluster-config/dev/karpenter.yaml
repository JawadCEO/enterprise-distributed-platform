# Capacity for tenant load (FR-12). Nodes are small, spot first, in private
# subnets, and carry the cost tags (FR-24). Names match Terraform's.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: eks-gitops-dev-karpenter-node
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags: { karpenter.sh/discovery: eks-gitops-dev }
  securityGroupSelectorTerms:
    - tags: { karpenter.sh/discovery: eks-gitops-dev }
  tags:
    environment: dev
    project: eks-gitops-platform
    owner: platform-team
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: tenants
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand] }
        - { key: kubernetes.io/arch, operator: In, values: [amd64] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: [t, m] }
        - { key: karpenter.k8s.aws/instance-size, operator: In, values: [medium, large] }
  # Hard ceiling, so a runaway tenant cannot break the budget (NFR-22).
  limits:
    cpu: "8"
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
