# One shared Gateway for every tenant (ADR-005). Tenants attach HTTPRoutes
# from namespaces labelled platform/tenant. cert-manager reads the annotation
# and issues the listener's certificate automatically (FR-11).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: platform
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: { from: Same }
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.localtest.me"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: shared-gateway-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - { key: platform/tenant, operator: Exists }
---
# Plain HTTP only ever redirects to HTTPS (NFR-11).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      sectionName: http
  rules:
    # Explicit defaults, so ArgoCD sees no difference from the live object.
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
