# FR-20: every container declares CPU and memory requests and a memory limit.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredresources
  annotations:
    description: Rejects containers without CPU and memory requests or a memory limit.
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredResources
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredresources

        import data.lib.pods

        required := [
          ["requests", "cpu"],
          ["requests", "memory"],
          ["limits", "memory"],
        ]

        violation[{"msg": msg}] {
          c := pods.containers[_]
          r := required[_]
          not has(c, r[0], r[1])
          msg := sprintf("container <%v> must set resources.%v.%v", [c.name, r[0], r[1]])
        }

        has(c, kind, res) {
          c.resources[kind][res]
        }
      libs:
        - |
          package lib.pods

          spec := input.review.object.spec { input.review.object.kind == "Pod" }
          spec := input.review.object.spec.template.spec { input.review.object.kind != "Pod"; input.review.object.spec.template }
          spec := input.review.object.spec.jobTemplate.spec.template.spec { input.review.object.kind == "CronJob" }

          containers[c] { c := spec.containers[_] }
          containers[c] { c := spec.initContainers[_] }
