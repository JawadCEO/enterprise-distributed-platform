{{- $q := index .Values.quotas .Values.size | required "size must be small, medium or large" }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: {{ .Values.name }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ $q.cpu | quote }}
    requests.memory: {{ $q.memory }}
    limits.cpu: {{ $q.cpu | quote }}
    limits.memory: {{ $q.memory }}
    pods: {{ $q.pods | quote }}
    services: {{ $q.services | quote }}
    services.loadbalancers: "0"     # tenants share the platform Gateway
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: {{ .Values.name }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        {{- toYaml .Values.defaultContainer.request | nindent 8 }}
      default:
        {{- toYaml .Values.defaultContainer.limit | nindent 8 }}
