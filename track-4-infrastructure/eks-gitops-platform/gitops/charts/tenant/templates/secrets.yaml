{{- if .Values.secrets.enabled }}
{{- if eq .Values.cluster "local" }}
# Local: a fake provider holding the tenant file's test values (ADR-009).
# Real secrets never exist on the laptop or in Git.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: tenant-secrets
  namespace: {{ .Values.name }}
spec:
  provider:
    fake:
      data:
        {{- toYaml (default (list) .Values.secrets.localTestData) | nindent 8 }}
{{- else }}
# AWS: the External Secrets controller assumes this tenant's role, which
# can read only platform/<cluster>/<tenant>/* in Secrets Manager (FR-16).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: tenant-secrets
  namespace: {{ .Values.name }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      role: arn:aws:iam::{{ required "awsAccountId is required on AWS" .Values.awsAccountId }}:role/eks-gitops-{{ .Values.cluster }}-tenant-{{ .Values.name }}-secrets
{{- end }}
{{- end }}
