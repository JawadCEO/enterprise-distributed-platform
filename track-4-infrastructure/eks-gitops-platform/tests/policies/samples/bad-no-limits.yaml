apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-limits
  namespace: team-a
  labels: { app.kubernetes.io/name: good, owner: team-a }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: good } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: good, owner: team-a }
    spec:
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          securityContext: { allowPrivilegeEscalation: false }
